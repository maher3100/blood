; BloodStains 1.0 by Ahmed Hazem - settings
[Blood]
; Wound size in metres (radius of the soaked area around the bullet hole)
WoundRadius=0.035
ShotgunWoundRadius=0.022
RifleWoundRadius=0.045
; Drips running down from each wound (0 = off; wounds only spread)
Drips=0
DripsMin=1
DripsMax=4
DripLength=0.22
; Seconds a fresh wound keeps spreading
FlowTime=8
; The body has one blood budget. Each wound uses a share of it and bleeds less (exponentially) the more is used;
; when it is used up the body is empty and new wounds show nothing. Shares: bullet 1/MaxBulletWounds,
; explosion 1/MaxExplosionWounds, fall 1/MaxFallWounds. (Blades, chainsaw and cars count like bullets.)
MaxBulletWounds=20
MaxExplosionWounds=4
MaxFallWounds=4
; Falls doing less damage than this leave no wound
FallMinDamage=8
; For corpses also: less the longer since death; at CorpseBleedTime seconds new wounds show nothing.
CorpseBleedTime=50
; Seconds for blood to dry from BloodColor to DriedColor
DryTime=180
; Colours as R,G,B (0-1), like a texture colour
BloodColor=0.36,0.03,0.03
DriedColor=0.20,0.05,0.035
; Blood texture resolution per ped texture (64-1024). 256 = 384 KB each
MaskSize=256
; Peds that keep blood at the same time (oldest is cleaned first, CJ never)
MaxBloodyPeds=32
; 1 = heads stay on after a headshot (the game normally pops them off)
KeepHeadOnHeadshot=1
; 1 = write BloodStains.log with one line per hit
Log=0
